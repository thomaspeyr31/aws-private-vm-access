<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#FFFFFF"/>

  <!-- Converging arrows: students -> endpoint -->
  <line x1="160" y1="80"  x2="308" y2="258" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="160" y1="260" x2="308" y2="260" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="160" y1="440" x2="308" y2="262" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Diverging arrows: endpoint -> VMs -->
  <line x1="462" y1="258" x2="578" y2="80"  stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="462" y1="260" x2="578" y2="260" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="462" y1="262" x2="578" y2="440" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Students -->
  <g>
    <rect x="20" y="40" width="140" height="80" rx="12" fill="#F4F5F7" stroke="#5F6368" stroke-width="2"/>
    <text x="90" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#3C4043">Élève — Alice</text>
    <text x="90" y="94" text-anchor="middle" font-size="11" fill="#5F6368">Mac perso</text>
    <circle cx="148" cy="52" r="8" fill="#D6336C"/>
  </g>
  <g>
    <rect x="20" y="220" width="140" height="80" rx="12" fill="#F4F5F7" stroke="#5F6368" stroke-width="2"/>
    <text x="90" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#3C4043">Élève — Bob</text>
    <text x="90" y="274" text-anchor="middle" font-size="11" fill="#5F6368">Mac perso</text>
    <circle cx="148" cy="232" r="8" fill="#5C6BC0"/>
  </g>
  <g>
    <rect x="20" y="400" width="140" height="80" rx="12" fill="#F4F5F7" stroke="#5F6368" stroke-width="2"/>
    <text x="90" y="435" text-anchor="middle" font-size="14" font-weight="600" fill="#3C4043">Élève — Chloé</text>
    <text x="90" y="454" text-anchor="middle" font-size="11" fill="#5F6368">Mac perso</text>
    <circle cx="148" cy="412" r="8" fill="#F4B400"/>
  </g>

  <!-- VPC boundary -->
  <rect x="280" y="20" width="640" height="480" rx="16" fill="#EAF2FD" stroke="#4A90D9" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="300" y="46" font-size="15" font-weight="700" fill="#2C5F9E">VPC — 10.0.0.0/16</text>

  <!-- EIC Endpoint (shared) -->
  <rect x="310" y="220" width="150" height="80" rx="12" fill="#F3E8FD" stroke="#9B59B6" stroke-width="2"/>
  <text x="385" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#6C3483">EIC Endpoint</text>
  <text x="385" y="266" text-anchor="middle" font-size="10.5" fill="#7D3C98">1 seul, partagé</text>
  <text x="385" y="282" text-anchor="middle" font-size="10.5" fill="#7D3C98">IAM ABAC : tag requis</text>

  <!-- Subnet privé -->
  <rect x="540" y="40" width="340" height="440" rx="14" fill="#E8F8F2" stroke="#1E9E8A" stroke-width="2"/>
  <text x="560" y="66" font-size="14" font-weight="700" fill="#12695C">Subnet privé</text>

  <!-- VMs -->
  <g>
    <rect x="580" y="40" width="140" height="80" rx="12" fill="#FFF3E0" stroke="#E8890C" stroke-width="2"/>
    <text x="650" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#B36B00">VM — Alice</text>
    <text x="650" y="94" text-anchor="middle" font-size="10.5" fill="#B36B00">tag Etudiant=alice</text>
    <circle cx="708" cy="52" r="8" fill="#D6336C"/>
  </g>
  <g>
    <rect x="580" y="220" width="140" height="80" rx="12" fill="#FFF3E0" stroke="#E8890C" stroke-width="2"/>
    <text x="650" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#B36B00">VM — Bob</text>
    <text x="650" y="274" text-anchor="middle" font-size="10.5" fill="#B36B00">tag Etudiant=bob</text>
    <circle cx="708" cy="232" r="8" fill="#5C6BC0"/>
  </g>
  <g>
    <rect x="580" y="400" width="140" height="80" rx="12" fill="#FFF3E0" stroke="#E8890C" stroke-width="2"/>
    <text x="650" y="435" text-anchor="middle" font-size="14" font-weight="600" fill="#B36B00">VM — Chloé</text>
    <text x="650" y="454" text-anchor="middle" font-size="10.5" fill="#B36B00">tag Etudiant=chloe</text>
    <circle cx="708" cy="412" r="8" fill="#F4B400"/>
  </g>

  <!-- Caption -->
  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#5F6368">Un seul EIC Endpoint, partagé — chaque élève n'atteint que la VM portant son propre tag (badge de couleur = correspondance)</text>
</svg>
