<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>

  <!-- Mac -->
  <rect x="20" y="190" width="150" height="100" rx="12" fill="#F4F5F7" stroke="#5F6368" stroke-width="2"/>
  <text x="95" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#3C4043">Mac</text>
  <text x="95" y="252" text-anchor="middle" font-size="12" fill="#5F6368">Papa</text>

  <!-- Arrow Mac -> Endpoint -->
  <line x1="170" y1="240" x2="330" y2="240" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">SSH via IAM</text>
  <text x="250" y="236" text-anchor="middle" font-size="11" fill="#5F6368">aws ec2-instance-connect ssh</text>

  <!-- VPC boundary -->
  <rect x="300" y="40" width="560" height="410" rx="16" fill="#EAF2FD" stroke="#4A90D9" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="320" y="68" font-size="15" font-weight="700" fill="#2C5F9E">VPC — 10.0.0.0/16</text>
  <text x="320" y="86" font-size="11" fill="#4A70A6">Aucun port ouvert sur internet</text>

  <!-- EIC Endpoint -->
  <rect x="330" y="190" width="150" height="100" rx="12" fill="#F3E8FD" stroke="#9B59B6" stroke-width="2"/>
  <text x="405" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#6C3483">EIC Endpoint</text>
  <text x="405" y="247" text-anchor="middle" font-size="11" fill="#7D3C98">eice-xxxxxxxx</text>
  <text x="405" y="265" text-anchor="middle" font-size="11" fill="#7D3C98">IAM: OpenTunnel</text>

  <!-- Arrow Endpoint -> VM -->
  <line x1="480" y1="240" x2="640" y2="240" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">Port 22</text>
  <text x="560" y="236" text-anchor="middle" font-size="11" fill="#5F6368">Source = SG endpoint</text>

  <!-- Subnet privé -->
  <rect x="600" y="100" width="240" height="300" rx="14" fill="#E8F8F2" stroke="#1E9E8A" stroke-width="2"/>
  <text x="620" y="128" font-size="14" font-weight="700" fill="#12695C">Subnet privé</text>
  <text x="620" y="146" font-size="11" fill="#12695C">10.0.1.0/24 — pas de route IGW</text>

  <!-- VM -->
  <rect x="640" y="190" width="160" height="100" rx="12" fill="#FFF3E0" stroke="#E8890C" stroke-width="2"/>
  <text x="720" y="227" text-anchor="middle" font-size="14" font-weight="600" fill="#B36B00">VM EC2</text>
  <text x="720" y="247" text-anchor="middle" font-size="11" fill="#B36B00">i-xxxxxxxxxxxx</text>
  <text x="720" y="265" text-anchor="middle" font-size="11" fill="#B36B00">t3.micro</text>

  <!-- Caption -->
  <text x="450" y="463" text-anchor="middle" font-size="12" fill="#5F6368">Aucune IP publique sur la VM — l'accès passe par IAM, jamais par un port exposé</text>
</svg>
